# Polish weather-warning recorder — scheduled poll.
#
# Facts this file relies on (GitHub docs, checked 2026-08-16):
#   - shortest cron interval GitHub accepts is 5 minutes ("*/5"); we use */10
#     because IMGW products live for hours and it halves the commit count.
#   - schedule is BEST-EFFORT: runs are queued and can start minutes late or be
#     skipped under load, especially at :00. poll.js records the actual time and
#     report.js prints the observed gap distribution — the drift is data, not a bug.
#   - scheduled workflows are auto-disabled after 60 days without repo activity.
#     Our own commits count as activity, but if the workflow ever stops for
#     60 days (e.g. all pushes fail), a human must re-enable it in the Actions tab.
#   - the schedule event runs the workflow file from the DEFAULT branch only.
#   - scheduled runs (and their failure emails) are attributed to the AUTHOR of
#     the commit that last touched the cron line — that email must be a verified
#     address on the pushing GitHub account, or nobody is notified (RUNBOOK step 2).
#   - GitHub emails on EVERY failed run, not only the first of a series; the
#     dedupe (fail only when new / >6 h since last notification) is check.js's job.
#   - pushes made with GITHUB_TOKEN never trigger workflows, so no [skip ci] is needed
#     (and this workflow has no push trigger anyway).
name: poll

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Never run two polls at once: they would both append to the same NDJSON files
# and race on the push. Queue, do not cancel.
concurrency:
  group: recorder-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    # Worst-case fetch path alone is 5 sources x (3 x 20 s + 7 s backoff) ≈ 6 min;
    # add checkout of a repo that grows ~0.5 MB/day.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # PAT fallback if the org forbids GITHUB_TOKEN pushes (RUNBOOK step 5):
          # token: ${{ secrets.RECORDER_PUSH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm install: the recorder has zero dependencies.
      # continue-on-error: whatever poll.js managed to write must still be
      # committed; a crash is reported through check.js (deduped) instead.
      - name: Poll all sources
        id: poll
        continue-on-error: true
        env:
          RECORDER_CONTACT: ${{ vars.RECORDER_CONTACT }}
          RECORDER_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: node src/poll.js

      # Health gate. Exit 1 only for NEW problems (or re-notify after 6 h);
      # known problems are ::warning:: annotations. Its exit code is captured
      # here and enforced at the end so the data of a sick tick is committed.
      - name: Health check
        id: health
        continue-on-error: true
        env:
          RECORDER_POLL_OUTCOME: ${{ steps.poll.outcome }}
        run: node src/check.js

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "recorder-bot"
          git config user.email "recorder-bot@users.noreply.github.com"
          git add -A data ledger state heartbeat.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          git commit -q -m "poll ${STAMP}"
          # Retry the push a few times: a manual push by a human between our
          # checkout and our push is the only realistic conflict.
          for i in 1 2 3; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            echo "push failed (attempt $i), rebasing on remote"
            git fetch origin ${GITHUB_REF_NAME}
            git rebase origin/${GITHUB_REF_NAME} || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Fail loudly if health check raised a new alarm
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::Recorder health check failed — see the 'Health check' step above (stale source > 2h, schema drift, zero items vs sibling, or poll crash)."
          exit 1
